# ==========================================================================
# CRE SECRETS FILE — ProofDesk
# ==========================================================================
# Maps the secret ID the workflow requests with `runtime.getSecret({ id })` to the
# environment variable holding its value. In a deployed Confidential Workflow these
# are released by the Vault DON directly into the attested enclave. In the local
# simulator they come from .env and are NOT confidential.
#
# Source credentials are demo-only random tokens that authorise reading one
# account's simulated ledger from the ProofDesk source service. They are never
# part of the public job inputs.
secretsNames:
    SOURCE_CRED_A:
        - SECRET_SOURCE_CRED_A
    SOURCE_CRED_B:
        - SECRET_SOURCE_CRED_B
